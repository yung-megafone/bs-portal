<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}B.S. Portal{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/portal.css">
</head>
<body>
<header class="site-header">
    <div>
        <a class="brand" href="{% url 'dashboard' %}">B.S. Portal</a>
        <span class="alpha-badge">ALPHA</span>
    </div>
    {% if user.is_authenticated %}
    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'departments:list' %}">Departments</a>
        <a href="{% url 'bam:list' %}">BAM</a>
        {% if user.is_staff %}<a href="/admin/">Admin</a>{% endif %}
        <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="link-button">Log out</button>
        </form>
    </nav>
    {% endif %}
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">B.S. Supply Co. internal operations platform — alpha environment</footer>
</body>
</html>
